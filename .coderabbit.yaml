# CodeRabbit configuration
# https://docs.coderabbit.ai/reference/configuration

language: "en-US"
tone_instructions: ""
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: ""
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: ""
  review_status: true
  review_details: false
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions: []
  in_progress_fortune: true
  poem: true
  enable_prompt_for_ai_agents: true
  path_filters: []
  path_instructions: []
  abort_on_close: true
  disable_cache: false

  slop_detection:
    enabled: true
    label: "slop"

  auto_review:
    enabled: true
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches:
      - ".*"
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    custom:
      - enabled: true
        name: "Confidence Rating"
        instructions: |
          Rate the confidence of this change using the following scale and include it in your review summary:

          5/5 — Ship it: Trivial or purely additive change with no risk to existing behavior.
          Examples: copy/config changes, new code behind a feature flag, test-only changes,
          additive schema changes with safe defaults, documentation updates.

          4/5 — Confident: Straightforward change with clear intent. Touches existing code paths
          but the scope is well-contained and tests cover the affected behavior.

          3/5 — Cautious: Moderate risk. Changes touch shared code, have incomplete test coverage,
          or alter behavior in ways that could have subtle downstream effects. Warrants careful
          human review.

          2/5 — Concerned: High risk. Broad changes to critical paths (payments, auth, data
          integrity, infrastructure), missing tests for important cases, complex logic changes,
          or destructive operations (database migrations that lock tables, resource replacements
          in IaC, removing public API surface).

          1/5 — Dangerous: Very high risk of breakage. Deleting or rewriting core functionality,
          removing checks, changing data models without migration coverage, or unprotected
          changes to production-critical flows or infrastructure.

  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: "warning"
      threshold: 80
    title:
      mode: "warning"
      requirements: ""
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - mode: "error"
        name: "Critical Issue Threshold"
        instructions: |
          Count the number of unresolved issues in this review that CodeRabbit has marked with a Critical severity. If the count is 5 or more, block the PR from merging.

  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: "default"
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: true
      config_file: ""
    phpstan:
      enabled: true
      level: "default"
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    golangci-lint:
      enabled: true
